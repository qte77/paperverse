[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperverse"
version = "0.1.0"
description = "3D multi-source paper cloud visualization"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "umap-learn>=0.5",
    "numpy>=1.26",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.scripts]
paperverse = "paperverse.__main__:main"

[dependency-groups]
dev = [
    "scriv[toml]>=1.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "inline-snapshot>=0.8",
    "ruff>=0.4",
    "pyright>=1.1.390",
    "pip-audit>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/paperverse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
# CI adds --cov-fail-under; local `make test` stays fast for Red-Green-Refactor.

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "B", "S", "SIM",
    "RUF", "PT", "ANN", "TC", "PGH", "C90", "D", "TRY",
]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# umap-learn ships no type stubs; relax only the two reports that fire solely at
# that untyped boundary (in layout.py). Every other strict check stays on.
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.inline-snapshot]
# Format created/updated snapshots with ruff (avoids the optional black dep).
format-command = "ruff format --stdin-filename {filename} -"

[tool.scriv]
format = "md"
fragment_directory = "changelog.d"
categories = ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Security"]
md_header_level = "2"
entry_title_template = "[{{ version }}] - {{ date.strftime('%Y-%m-%d') }}"
md_html_anchors = false
