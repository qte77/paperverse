[project]
name = "paperverse"
version = "0.1.0"
description = "3D multi-source paper cloud visualization"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "umap-learn>=0.5",
    "numpy>=1.26",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "inline-snapshot>=0.8",
    "ruff>=0.4",
]

# Scaffold phase: not built as a wheel yet. When the CLI lands, add
# [build-system] (hatchling), [tool.hatch.build.targets.wheel] packages =
# ["src/paperverse"], and [project.scripts] paperverse = "paperverse.__main__:main".
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
# CI adds --cov-fail-under; local `make test` stays fast for Red-Green-Refactor.

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "B", "S", "SIM",
    "RUF", "PT", "ANN", "TC", "PGH", "C90", "D", "TRY",
]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10
