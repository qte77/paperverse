# lychee link-checker configuration
# See: https://lychee.cli.rs/usage/config/

# Resolve root-relative paths (e.g. /src/theme.css) against the ui/ tree,
# where Vite serves the project from ui/ with /src/... rooted there.
root_dir = "ui"

# Some sites return 403 to automated crawlers (anti-bot / rate-limiting) even
# though the URL is valid in a browser. Exclude those to avoid false positives:
#   - www.npmjs.com   — packages verified via the npm registry API instead
#   - www.whiteboxgeo.com — prior-art reference, reachable in-browser
exclude = ["https://www\\.npmjs\\.com/", "https://www\\.whiteboxgeo\\.com/"]
