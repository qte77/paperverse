---
name: UI
on:
  push:
    branches: [main]
    paths: ['ui/**', '.github/workflows/ui.yml']
  pull_request:
    paths: ['ui/**', '.github/workflows/ui.yml']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: typecheck + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
...
