---
name: UI
on:
  push:
    branches: [main]
    paths: ['ui/**', '.github/workflows/ui.yml']
  pull_request:
    paths: ['ui/**', '.github/workflows/ui.yml']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: typecheck + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
...
