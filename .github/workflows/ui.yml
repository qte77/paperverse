---
name: UI
on:
  push:
    branches: [main]
    paths: ['ui/**', '.github/workflows/ui.yml']
  pull_request:
    paths: ['ui/**', '.github/workflows/ui.yml']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: typecheck + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
...
