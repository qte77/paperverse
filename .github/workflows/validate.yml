---
name: Validate
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: lint + types + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERBOSE: "1"
      NUMBA_NUM_THREADS: "1" # serial numba -> reproducible UMAP layout (matches n_jobs=1)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync
      - run: make lint
      - run: make check_types
      - run: make audit
      - run: make test_cov
...
