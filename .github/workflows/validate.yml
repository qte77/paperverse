---
name: Validate
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: lint + types + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERBOSE: "1"
      NUMBA_NUM_THREADS: "1" # serial numba -> reproducible UMAP layout (matches n_jobs=1)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
      - run: uv sync
      - run: make lint
      - run: make check_types
      - run: make audit
      - run: make test_cov
...
