---
name: publish-release

# Manually publishes a GitHub Release for an existing tag, with notes
# extracted from the CHANGELOG.md ## [version] block, via the shared
# qte77/.github reusable. Aborts if the Release already exists. Decoupled
# from tag-release.yaml so the default flow stays "tag only".

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (defaults to the latest v* tag)"
        required: false
        type: string

permissions: {}

jobs:
  publish:
    uses: qte77/.github/.github/workflows/publish-release.yml@86d329865ce47b43b6e745084c92032b41dcab1b  # 2026-10-24
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag }}
