---
# Build the Vite UI with a build-time-bundled papers.db + positions.bin (generated
# by the Python pipeline) and deploy to GitHub Pages. Pages source = "GitHub Actions"
# (Settings -> Pages -> Source). No data branch — artifacts are bundled per ADR-0001.

name: gh-pages

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "src/paperverse/**"
      - "data/**"
      - ".github/workflows/gh-pages.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: build + deploy ui to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Generate papers.db + positions.bin (demo + real datasets)
        env:
          NUMBA_NUM_THREADS: "1" # serial numba -> reproducible UMAP layout (matches n_jobs=1)
        run: |
          uv sync
          uv run paperverse --data-dir data/demo --output ui/public/data/demo
          uv run paperverse --data-dir data/real --output ui/public/data/real

      - name: Build the UI
        working-directory: ui
        run: |
          npm ci
          cp node_modules/sql.js-fts5/dist/sql-wasm.wasm public/sql-wasm.wasm
          npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ui/dist

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
