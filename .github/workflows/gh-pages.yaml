---
# Build the Vite UI with a build-time-bundled papers.db + positions.bin (generated
# by the Python pipeline) and deploy to GitHub Pages. Pages source = "GitHub Actions"
# (Settings -> Pages -> Source). No data branch — artifacts are bundled per ADR-0001.

name: gh-pages

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "src/paperverse/**"
      - "data/**"
      - ".github/workflows/gh-pages.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: build + deploy ui to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Generate papers.db + positions.bin (demo + real datasets)
        run: |
          uv sync
          uv run paperverse --data-dir data/demo --output ui/public/data/demo
          uv run paperverse --data-dir data/real --output ui/public/data/real

      - name: Build the UI
        working-directory: ui
        run: |
          npm ci
          cp node_modules/sql.js-fts5/dist/sql-wasm.wasm public/sql-wasm.wasm
          npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ui/dist

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
