---
name: bump-my-version

# Manually-triggered version bump via the shared qte77/.github reusable
# (bump-my-version --no-tag, uv.lock sync, scriv collect, signed commit
# via the GitHub API, release PR). Tagging is deferred to tag-release.yaml,
# which tags main's squash-merge commit so `v{new}` is always reachable
# from main.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Semver part to bump"
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

permissions: {}

jobs:
  bump:
    uses: qte77/.github/.github/workflows/bump-version.yml@86d329865ce47b43b6e745084c92032b41dcab1b  # 2026-10-24
    permissions:
      contents: write
      pull-requests: write
    with:
      bump_type: ${{ inputs.bump_type }}
      use_uv: true
      sync_lockfile: true
      collect_scriv: true
      pr_title_template: "chore(release): bump {previous} -> {current}"
