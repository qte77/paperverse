---
name: tag-release

# Watches main for pyproject.toml version changes (typically the
# squash-merge of a bump-my-version release PR) and creates the
# annotated `v$NEW` tag via the shared qte77/.github reusable. Exits 0
# when the version is unchanged and aborts if the tag already exists
# (never deletes), so a workflow_dispatch run is a safe dry run.

on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:

permissions: {}

jobs:
  tag:
    uses: qte77/.github/.github/workflows/tag-release.yml@86d329865ce47b43b6e745084c92032b41dcab1b  # 2026-10-24
    permissions:
      contents: write
