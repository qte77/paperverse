---
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    groups:
      npm-deps:
        patterns: ["*"]
    ignore:
      # @types/sql.js must match the sql.js-fts5 runtime (a sql.js 1.4.0 fork); 1.16+ types
      # describe APIs the fork lacks. Lift this when the runtime moves past 1.4.
      - dependency-name: "@types/sql.js"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
...
