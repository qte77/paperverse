<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paperverse</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply a saved Light/Dark choice before the stylesheet loads, so a
      // returning visitor never sees a flash of the wrong theme. "system" stores
      // nothing and is handled by the prefers-color-scheme media query in
      // theme.css; main.ts later resolves it to a concrete data-theme.
      (function () {
        try {
          var t = localStorage.getItem("paperverse-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.dataset.theme = t;
          }
        } catch (e) {
          /* localStorage unavailable (private mode): fall back to the OS scheme. */
        }
      })();
    </script>
    <link rel="stylesheet" href="/src/theme.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      /* data-theme drives the system color-scheme; the empty transparent canvas
         shows the themed page background. EyeRest tokens layer on by pointer.
         No attribute (system) tracks the OS via light dark. */
      html {
        color-scheme: light dark;
      }
      html[data-theme="light"] {
        color-scheme: light;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
      }
      #cloud {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #tooltip {
        position: absolute;
        pointer-events: none;
        max-width: 22rem;
        padding: 0.25rem 0.5rem;
        font: 0.85rem/1.4 var(--font-sans);
        background: var(--surface);
        color: var(--text);
        border-radius: 4px;
      }
      #detail {
        position: fixed;
        top: 0;
        right: 0;
        width: min(28rem, 90vw);
        height: 100%;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 1.5rem;
        font: 1rem/1.5 var(--font-sans);
        background: var(--surface);
        color: var(--text);
      }
      #detail-close {
        float: right;
        border: 0;
        background: transparent;
        color: var(--text);
        font-size: 1.2rem;
        cursor: pointer;
      }
      #detail-meta {
        opacity: 0.75;
        font-size: 0.85rem;
      }
      #toolbar {
        position: fixed;
        top: 1rem;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
        max-width: 96vw;
      }
      #search-form {
        margin: 0;
      }
      #search {
        width: min(28rem, 80vw);
        padding: 0.5rem 0.75rem;
        font: 1rem var(--font-sans);
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--text);
        border-radius: 6px;
      }
      #theme-toggle,
      #reset {
        padding: 0.4rem 0.5rem;
        font: 0.9rem var(--font-sans);
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--text);
        border-radius: 6px;
        cursor: pointer;
      }
      /* Reserve the widest label ("◐ System") so the centered toolbar doesn't
         shift sideways as the toggle cycles System → Light → Dark. The hidden
         ::before pins the button's content width regardless of the live label. */
      #theme-toggle {
        text-align: center;
      }
      #theme-toggle::before {
        content: "◐ System";
        display: block;
        height: 0;
        overflow: hidden;
        visibility: hidden;
      }
      /* Visually hidden but exposed to assistive tech (live-region announcements). */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
      #status {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 0.6rem 1rem;
        font: 1rem var(--font-sans);
        color: var(--text);
        background: var(--surface);
        border-radius: 6px;
      }
      /* Read-only source colour key, sitting inline in the toolbar. Swatch
         colours reference the same --data-* tokens the points use; the axis
         encoding + date range is the chip's title (set in main.ts). */
      #legend {
        display: flex;
        align-items: center;
        gap: 0.2rem 0.5rem;
        padding: 0.4rem 0.6rem;
        font: 0.85rem var(--font-sans);
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--text);
        border-radius: 6px;
      }
      #legend .swatch {
        display: inline-block;
        width: 0.65em;
        height: 0.65em;
        margin-right: 0.2em;
        border-radius: 50%;
        vertical-align: middle;
      }
      #legend .arxiv {
        background: var(--data-caution);
      }
      #legend .biorxiv {
        background: var(--data-alt);
      }
      #legend .medrxiv {
        background: var(--data-negative);
      }
      #legend .src {
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas id="cloud"></canvas>
    <div id="toolbar">
      <form id="search-form" role="search">
        <input id="search" type="search" placeholder="Search papers…" autocomplete="off" />
      </form>
      <button id="theme-toggle" type="button" aria-label="Theme" title="Theme">◐ System</button>
      <button id="reset" type="button" title="Reset view" aria-label="Reset view">Reset</button>
      <div id="legend" role="img" aria-label="Paper source colour key: arXiv, bioRxiv, medRxiv">
        <span class="src"><span class="swatch arxiv"></span>arXiv</span>
        <span class="src"><span class="swatch biorxiv"></span>bioRxiv</span>
        <span class="src"><span class="swatch medrxiv"></span>medRxiv</span>
      </div>
    </div>
    <div id="status" role="status" aria-live="polite">Loading…</div>
    <div id="theme-status" class="sr-only" role="status" aria-live="polite"></div>
    <div id="tooltip" hidden aria-live="polite"></div>
    <aside id="detail" hidden>
      <button id="detail-close" aria-label="Close">✕</button>
      <h2 id="detail-title"></h2>
      <p id="detail-meta"></p>
      <p id="detail-abstract"></p>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
