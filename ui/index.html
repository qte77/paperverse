<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paperverse</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/theme.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      /* data-theme drives the system color-scheme; the empty transparent canvas
         shows the themed page background. EyeRest tokens layer on by pointer. */
      html[data-theme="light"] {
        color-scheme: light;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
      }
      #cloud {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #tooltip {
        position: absolute;
        pointer-events: none;
        max-width: 22rem;
        padding: 0.25rem 0.5rem;
        font: 0.85rem/1.4 var(--font-sans);
        background: var(--surface);
        color: var(--text);
        border-radius: 4px;
      }
      #detail {
        position: fixed;
        top: 0;
        right: 0;
        width: min(28rem, 90vw);
        height: 100%;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 1.5rem;
        font: 1rem/1.5 var(--font-sans);
        background: var(--surface);
        color: var(--text);
      }
      #detail-close {
        float: right;
        border: 0;
        background: transparent;
        color: var(--text);
        font-size: 1.2rem;
        cursor: pointer;
      }
      #detail-meta {
        opacity: 0.75;
        font-size: 0.85rem;
      }
      #toolbar {
        position: fixed;
        top: 1rem;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      #search-form {
        margin: 0;
      }
      #search {
        width: min(28rem, 80vw);
        padding: 0.5rem 0.75rem;
        font: 1rem var(--font-sans);
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--text);
        border-radius: 6px;
      }
      #theme,
      #reset {
        padding: 0.4rem 0.5rem;
        font: 0.9rem var(--font-sans);
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--text);
        border-radius: 6px;
        cursor: pointer;
      }
      #status {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 0.6rem 1rem;
        font: 1rem var(--font-sans);
        color: var(--text);
        background: var(--surface);
        border-radius: 6px;
      }
      /* Read-only key: source colours (= the clusters) + what the axes encode.
         Swatch colours reference the same --data-* tokens the points use. */
      #legend {
        position: fixed;
        bottom: 1rem;
        left: 1rem;
        padding: 0.4rem 0.6rem;
        font: 0.8rem/1.5 var(--font-sans);
        color: var(--text);
        background: var(--surface);
        border-radius: 6px;
        pointer-events: none;
      }
      #legend .swatch {
        display: inline-block;
        width: 0.65em;
        height: 0.65em;
        margin-right: 0.2em;
        border-radius: 50%;
        vertical-align: middle;
      }
      #legend .arxiv {
        background: var(--data-caution);
      }
      #legend .biorxiv {
        background: var(--data-alt);
      }
      #legend .medrxiv {
        background: var(--data-negative);
      }
      #legend .axis {
        display: block;
        margin-top: 0.25rem;
        font-size: 0.75rem;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <canvas id="cloud"></canvas>
    <div id="toolbar">
      <form id="search-form" role="search">
        <input id="search" type="search" placeholder="Search papers…" autocomplete="off" />
      </form>
      <select id="theme" aria-label="Theme" title="Theme">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
      <button id="reset" type="button" title="Reset view" aria-label="Reset view">Reset</button>
    </div>
    <div id="status" role="status" aria-live="polite">Loading…</div>
    <div id="tooltip" hidden aria-live="polite"></div>
    <aside id="detail" hidden>
      <button id="detail-close" aria-label="Close">✕</button>
      <h2 id="detail-title"></h2>
      <p id="detail-meta"></p>
      <p id="detail-abstract"></p>
    </aside>
    <div id="legend" aria-label="Legend">
      <span class="swatch arxiv"></span>arXiv
      <span class="swatch biorxiv"></span>bioRxiv
      <span class="swatch medrxiv"></span>medRxiv
      <span class="axis">position = category similarity · depth = date (old → new)</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
