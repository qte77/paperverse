<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paperverse</title>
    <link rel="stylesheet" href="/src/theme.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      /* data-theme drives the system color-scheme; the empty transparent canvas
         shows the themed page background. EyeRest tokens layer on by pointer. */
      html[data-theme="light"] {
        color-scheme: light;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
      }
      body {
        background: var(--bg);
        color: var(--text);
      }
      #cloud {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="cloud"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
